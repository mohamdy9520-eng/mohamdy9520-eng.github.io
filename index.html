<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skillro</title>
  <meta name="description" content="Skillro builds useful mobile apps. Explore our apps and get in touch." />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f6f7fb;
      color: #1c1f2a;
      line-height: 1.6;
    }
    header {
      background: #1c1f2a;
      color: #ffffff;
      text-align: center;
      padding: 64px 20px;
    }
    header h1 { font-size: 2.4rem; letter-spacing: 1px; }
    header p { margin-top: 12px; color: #c7cbd9; }
    main { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
    h2 { margin-bottom: 20px; font-size: 1.4rem; }
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .card h3 { margin-bottom: 8px; }
    .card p { color: #4a4f60; margin-bottom: 14px; }
    .btn {
      display: inline-block;
      background: #2f6bff;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
    }
    .contact a { color: #2f6bff; text-decoration: none; }
    footer {
      text-align: center;
      padding: 24px 20px 40px;
      color: #7a8093;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Skillro</h1>
    <p>Building simple, useful mobile apps.</p>
  </header>

  <main>
    <h2>Our Apps</h2>

    <div class="card">
      <h3>Monevro</h3>
      <p>AI-powered expense tracker that helps you understand and manage your spending.</p>
      <a class="btn" href="https://mohamdy9520-eng.github.io/monevro-site/">Learn more</a>
    </div>

    <h2>Contact</h2>
    <div class="card contact">
      <p>Questions or feedback? Email us at
        <a href="mailto:skillro.support@gmail.com">skillro.support@gmail.com</a>
      </p>
    </div>
  </main>

  <footer>
    &copy; 2026 Skillro. All rights reserved.
  </footer>
</body>
</html>
